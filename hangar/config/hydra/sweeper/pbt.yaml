defaults:
  - pbt_schema
  - _self_

budget_variable:
  total_timesteps: ${total_timesteps}
  num_epochs: ${num_epochs}
checkpoint: checkpoint
overrides:
  - scoring=final
  - +artisan@artisans.checkpoint=checkpoint
  - +logger@loggers.orbax=orbax
  - ++loggers.orbax.max_to_keep=1
  - ++loggers.orbax.best=false
