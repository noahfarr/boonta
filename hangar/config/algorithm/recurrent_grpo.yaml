# @package _global_

algorithm:
  _target_: boonta.algorithms.recurrent_grpo.RecurrentGRPOConfig
  group_size: 8
  num_minibatches: 16
  update_epochs: 2
  clip_coefficient: 0.2
  kl_coefficient: 0.04
  gamma: 1.0

rollout:
  num_steps: 30

environment:
  num_envs: 128

optimizer:
  lr: 1e-5
  max_grad_norm: 0.5
