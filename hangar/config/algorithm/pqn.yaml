# @package _global_

algorithm:
  _target_: boonta.algorithms.pqn.PQNConfig
  num_minibatches: 4
  update_epochs: 1
  gamma: 0.99
  q_lambda: 0.65
  bb8:
    _target_: boonta.algorithms.bb8.BB8Config
    noise_scale_probe: False
    num_groups: 64
    decay: 0.9
    log_update_kl: False
    fisher_states: 1024
    running_advantage_normalization: False
    advantage_horizon: 524288.0

podracer:
  config:
    num_steps: 16

environment:
  num_envs: 128

optimizer:
  lr: 5e-4
  max_grad_norm: 10.0

exploration:
  start: 1.0
  end: 0.01
  fraction: 0.2
