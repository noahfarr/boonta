# @package _global_

defaults:
  - /dataset: minari/mujoco/expert
  - override /podracer: quadinaros

algorithm:
  _target_: boonta.algorithms.iql.IQLConfig
  gamma: 0.99
  tau: 0.005
  batch_size: 256
  expectile: 0.7
  beta: 3.0
  max_advantage_weight: 100.0

environment:
  num_envs: 32

optimizer:
  actor_lr: 3e-4
  critic_lr: 3e-4
  value_lr: 3e-4
