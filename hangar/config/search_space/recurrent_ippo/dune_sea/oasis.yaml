# @package search_space
optimizer.lr:
  distribution: log_normal
  min: 1e-4
  max: 1e-3
  center: 3e-4
optimizer.max_grad_norm:
  distribution: log_normal
  min: 0.25
  max: 2.0
  center: 0.5
algorithm.entropy_coefficient:
  distribution: log_normal
  min: 1e-3
  max: 3e-2
  center: 3e-3
algorithm.value_coefficient:
  distribution: log_normal
  min: 0.25
  max: 4.0
  center: 0.5
algorithm.gamma:
  distribution: logit_normal
  min: 0.95
  max: 0.999
  center: 0.995
algorithm.gae_lambda:
  distribution: logit_normal
  min: 0.8
  max: 0.99
  center: 0.95
algorithm.clip_coefficient:
  distribution: uniform
  min: 0.1
  max: 0.3
  center: 0.2
algorithm.num_minibatches:
  distribution: uniform_pow2
  min: 2
  max: 32
  center: 8
algorithm.update_epochs:
  distribution: int_uniform
  min: 1
  max: 4
  center: 2
podracer.config.num_steps:
  distribution: uniform_pow2
  min: 32
  max: 128
  center: 64
environment.num_envs:
  distribution: uniform_pow2
  min: 512
  max: 2048
  center: 1024
cell.features:
  distribution: uniform_pow2
  min: 64
  max: 256
  center: 128
num_layers:
  distribution: int_uniform
  min: 1
  max: 4
  center: 2
stack.expansion_factor:
  distribution: uniform_pow2
  min: 2
  max: 8
  center: 4
