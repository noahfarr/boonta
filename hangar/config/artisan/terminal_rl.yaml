# @package _global_
artisans:
  checkpoint:
    _target_: boonta.artisans.Checkpointer
  heldout:
    _target_: hangar.terminal_evaluation.TerminalEvaluation
    tokenizer: ${environment.kwargs.tokenizer_id}
    context: ${cell.context_length}
    directory: ${hydra:runtime.output_dir}/evaluation
    episodes: 64
    seed: 271828
    max_tokens: ${environment.kwargs.max_tokens}
loggers:
  file:
    _target_: boonta.loggers.FileLogger
    directory: ${hydra:runtime.output_dir}
  orbax:
    _target_: boonta.loggers.OrbaxLogger
    directory: ${hydra:runtime.output_dir}/checkpoints
    max_to_keep: 2
    best: false
