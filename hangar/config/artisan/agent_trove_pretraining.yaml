# @package _global_
artisans:
  checkpoint:
    _target_: boonta.artisans.Checkpointer
    fields: [algorithm_state, dataset_state]
    score:
      _target_: operator.itemgetter
      _args_: [actor/log_likelihood]
loggers:
  file:
    _target_: boonta.loggers.FileLogger
    directory: ${hydra:runtime.output_dir}
  orbax:
    _target_: boonta.loggers.OrbaxLogger
    directory: ${hydra:runtime.output_dir}/checkpoints
    max_to_keep: 2
    best: false
