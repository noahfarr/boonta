# @package _global_

defaults:
  - /dataset: fineweb

num_steps: 122_880_000
num_epochs: 100
score: network/nll

network:
  vocab_size: 50257
  dtype: bfloat16

algorithm:
  batch_size: 6

optimizer:
  lr: 6e-4
  final_lr: 6e-5
  warmup_updates: 2000
  beta1: 0.9
  beta2: 0.99
  max_grad_norm: 1.0
  weight_decay: 0.1

podracer:
  config:
    batch_shape:
      - ${algorithm.batch_size}
      - ${dataset.kwargs.length}
    mesh:
      count: 1
