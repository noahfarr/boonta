# @package _global_

num_steps: 245_760_000

environment:
  num_envs: 8192

podracer:
  config:
    num_steps: 32

cell:
  _target_: boonta.networks.MinGRUCell
  features: 128

torso:
  _target_: boonta.networks.SSM

algorithm:
  update_epochs: 1
  clip_coefficient: 0.2
  clip_value_loss: true
  entropy_coefficient: 1e-3
  value_coefficient: 0.5
  gamma: 0.995
  gae_lambda: 0.98
  normalize_advantage: true

optimizer:
  lr: 1e-4
  max_grad_norm: 0.5
