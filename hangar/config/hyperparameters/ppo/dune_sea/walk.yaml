# @package _global_

num_steps: 200_000_000
num_epochs: 20

algorithm:
  gamma: 0.97
  gae_lambda: 0.95
  num_minibatches: 32
  update_epochs: 4
  normalize_advantage: True
  clip_coefficient: 0.2
  clip_value_loss: True
  entropy_coefficient: 0.005

podracer:
  config:
    num_steps: 20

optimizer:
  lr: 3e-4
  max_grad_norm: 1.0

network:
  actor: [512, 256, 128]
  critic: [512, 256, 128]
