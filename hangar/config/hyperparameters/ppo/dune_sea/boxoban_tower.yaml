# @package _global_

num_steps: 100_000_000

num_epochs: 50

algorithm:
  num_minibatches: 8
  update_epochs: 2
  entropy_coefficient: 0.01
  normalize_advantage: True
  gamma: 0.99
  gae_lambda: 0.95

podracer:
  config:
    num_steps: 64

environment:
  num_envs: 1024

optimizer:
  lr: 3e-4
  max_grad_norm: 0.5
