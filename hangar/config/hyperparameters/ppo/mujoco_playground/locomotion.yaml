# @package _global_

total_timesteps: 200_000_000

algorithm:
  gamma: 0.97
  gae_lambda: 0.95
  num_minibatches: 32
  update_epochs: 4
  normalize_advantage: True
  clip_coefficient: 0.2
  clip_value_loss: False
  entropy_coefficient: 0.005

rollout:
  num_steps: 20

environment:
  num_envs: 8192

optimizer:
  lr: 3.0e-4
  b1: 0.9
  b2: 0.999
  max_grad_norm: 1.0

network:
  actor:
    features: 512
    layers: 3
  critic:
    features: 512
    layers: 3
