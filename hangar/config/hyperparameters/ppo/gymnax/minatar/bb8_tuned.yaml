# @package _global_
# BB-8 tuned PPO for MinAtar: the values of prd's hyperparameters/ppo/gymnax/minatar/breakout.yaml (tuned on Breakout),
# applied to every MinAtar game. Select with `hyperparameters=ppo/gymnax/minatar/bb8_tuned`. prd's stale top-level
# `rollout.num_steps: 16` is not copied: T is podracer.config.num_steps, 16 by default.

num_steps: 20_000_000

algorithm:
  num_minibatches: 16
  update_epochs: 4
  clip_coefficient: 0.14
  clip_value_loss: True
  entropy_coefficient: 0.003
  value_coefficient: 0.5
  gamma: 0.989
  gae_lambda: 0.77
  normalize_advantage: True

environment:
  num_envs: 8192

optimizer:
  lr: 2.4e-3
  max_grad_norm: 1.5
