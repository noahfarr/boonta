# @package _global_

num_steps: 20_000_000
num_epochs: 40

algorithm:
  gae_lambda: 0.95
  gamma: 0.99
  num_minibatches: 16
  update_epochs: 4
  normalize_advantage: True
  clip_coefficient: 0.2
  clip_value_loss: True
  entropy_coefficient: 0.005

podracer:
  config:
    num_steps: 64

environment:
  num_envs: 1024

optimizer:
  lr: 3e-4
  max_grad_norm: 0.5
