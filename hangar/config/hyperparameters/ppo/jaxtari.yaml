# @package _global_

# Atari defaults of CleanRL's ppo_atari, not tuned for JAXtari

num_steps: 10_000_000

algorithm:
  num_minibatches: 4
  update_epochs: 4
  clip_coefficient: 0.1
  entropy_coefficient: 0.01
  normalize_advantage: True

podracer:
  config:
    num_steps: 128

environment:
  num_envs: 128

optimizer:
  lr: 2.5e-4
  max_grad_norm: 0.5
