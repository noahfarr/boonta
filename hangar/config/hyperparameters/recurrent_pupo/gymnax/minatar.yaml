# @package _global_

num_steps: 104_857_600

num_epochs: 20

environment:
  num_envs: 8192
  sticky_action_prob: 0.1
  kwargs:
    use_minimal_action_set: false
    params:
      max_steps_in_episode: 100000

podracer:
  config:
    num_steps: 64

num_layers: 2

cell:
  features: 256
  dtype: bfloat16

network:
  encoder: linear
  dtype: bfloat16

algorithm:
  num_minibatches: 16
  update_epochs: 2
  clip_coefficient: 0.2
  clip_value_loss: true
  entropy_coefficient: 0.01
  value_coefficient: 2.0
  gamma: 0.99
  gae_lambda: 0.90

optimizer:
  name: muon
  lr: 0.015
  anneal: true
  max_grad_norm: 1.5
