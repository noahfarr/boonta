# @package _global_

total_timesteps: 100_000_000

dtype: float32

cell:
  _target_: boonta.networks.MinGRUCell
  features: 256
  dtype: ${dtype}

torso:
  _target_: boonta.networks.SSM
  cell: ${cell}

stack: ${torso}

num_layers: 1

algorithm:
  gamma: 1.0
  gae_lambda: 0.97
  num_minibatches: 4
  update_epochs: 2
  clip_coefficient: 0.2
  clip_value_loss: True
  entropy_coefficient: 0.003
  value_coefficient: 0.5
  normalize_advantage: True
  priority_exponent: 0.8

importance_exponent:
  value: 0.2

rollout:
  num_steps: 64

evaluation:
  num_steps: 719

environment:
  num_envs: 256

network:
  features: 96
  blocks: 4
  dtype: ${dtype}
  market_none_bias: 11.0
  auxiliary_coefficient: 0.5
  pretrained: null
  anchor_coefficient: 0.1

optimizer:
  lr: 3.0e-4
  max_grad_norm: 0.5
  accumulate: 1
  warmup_steps: 0
  critic_warmup_steps: 30_000
