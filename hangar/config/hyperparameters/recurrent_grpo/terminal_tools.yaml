# @package _global_
defaults:
  - /torso: default
  - /cell: qwen3
  - /stack: qwen3
  - _self_
seed: 42
num_layers: 12
num_steps: 100000
num_epochs: 20
evaluate_initial: true
pretraining_checkpoint: ???
score: training/episode_return
cell:
  features: 512
  num_heads: 8
  num_groups: 2
  head_dim: 64
  context_length: 4096
stack:
  hidden_dim: 1536
network:
  vocab_size: 151936
  dtype: bfloat16
  logit_chunk_size: 128
algorithm:
  group_size: 8
  num_minibatches: 8
  update_epochs: 2
  clip_coefficient: 0.2
  kl_coefficient: 0.04
  gamma: 1.0
optimizer:
  lr: 1e-5
  max_grad_norm: 0.5
podracer:
  config:
    num_steps: 5
    mesh:
      count: 1
