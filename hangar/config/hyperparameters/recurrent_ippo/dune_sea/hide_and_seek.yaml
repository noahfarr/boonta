# @package _global_

cell:
  _target_: boonta.networks.MinGRUCell
  features: 128

torso:
  _target_: boonta.networks.SSM

# 477 updates at 8,192 environments × 64 steps × 4 agents.
num_steps: 1_000_000_000
# The mean return across both teams cancels in the default 2v2 match.
score: training/agent_0/episode_return

environment:
  num_envs: 8192

podracer:
  config:
    num_steps: 64

algorithm:
  # 2,048 environments of 64 steps, with 4 agents each, per minibatch.
  num_minibatches: 4
  update_epochs: 2
  # Preparation lasts 96 steps, so hiding pays off far beyond a 0.99 horizon.
  gamma: 0.998
