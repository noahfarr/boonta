# @package _global_

cell:
  _target_: boonta.networks.MinGRUCell
  features: 128
  dtype: ${oc.select:network.dtype,null}

torso:
  _target_: boonta.networks.SSM

network:
  dtype: bfloat16

num_layers: 3

llama:
  _target_: boonta.networks.llama
  block: ${torso}
  num_layers: ${num_layers}
  dtype: ${oc.select:network.dtype,null}
  features: ${cell.features}
  expansion_factor: 4

stack: ${llama}

num_steps: 1_000_000_000

environment:
  num_envs: 1024

podracer:
  config:
    num_steps: 64

algorithm:
  num_minibatches: 8
  update_epochs: 1
  gamma: 0.9959
  gae_lambda: 0.952
  entropy_coefficient: 0.0032
  value_coefficient: 0.47
  clip_coefficient: 0.19
  normalize_advantage: True

optimizer:
  lr: 3.4e-4
  max_grad_norm: 0.46
