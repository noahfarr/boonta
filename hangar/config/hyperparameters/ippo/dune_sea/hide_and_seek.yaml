# @package _global_

# 100 updates at 8,192 environments × 64 steps × 4 agents.
num_steps: 209_715_200
# The mean return across both teams cancels in the default 2v2 match.
score: training/agent_0/episode_return

environment:
  num_envs: 8192

podracer:
  config:
    num_steps: 64

algorithm:
  # 131,072 environment transitions per minibatch, with 4 agents each.
  # Baker et al. (2019) found that small minibatches never reached ramp defence.
  num_minibatches: 4
  # Preparation lasts 96 steps, so hiding pays off far beyond a 0.99 horizon.
  gamma: 0.998
