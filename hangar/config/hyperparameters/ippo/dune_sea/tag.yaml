# @package _global_

num_steps: 1_000_000_000

environment:
  num_envs: 1024

podracer:
  config:
    num_steps: 32

algorithm:
  num_minibatches: 32
  update_epochs: 2
  gamma: 0.99
  gae_lambda: 0.95
  entropy_coefficient: 0.003
  normalize_advantage: True

optimizer:
  lr: 3e-4
  max_grad_norm: 0.5
