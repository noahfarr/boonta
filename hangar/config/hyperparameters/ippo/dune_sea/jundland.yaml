# @package _global_

network:
  dtype: bfloat16

num_steps: 1_000_000_000

environment:
  num_envs: 64

podracer:
  config:
    num_steps: 32

algorithm:
  num_minibatches: 32
  update_epochs: 2
  gamma: 0.995
  gae_lambda: 0.95
  entropy_coefficient: 0.03
  normalize_advantage: False

optimizer:
  lr: 3e-4
  max_grad_norm: 0.5
