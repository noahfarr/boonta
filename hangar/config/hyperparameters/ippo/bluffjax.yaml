# @package _global_

num_steps: 20_000_000

environment:
  num_envs: 1024

podracer:
  config:
    num_steps: 32

algorithm:
  num_minibatches: 8
  update_epochs: 2
  gamma: 1.0
  gae_lambda: 0.95
  entropy_coefficient: 0.01

optimizer:
  lr: 3e-4
  max_grad_norm: 0.5

network:
  features: 256
  layers: 2
